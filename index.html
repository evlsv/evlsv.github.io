<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintPro</title>
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --primary-color: #254100;
            --secondary-color: #f4f4f4;
            --social-link-size: 1.7rem;
        }

        #contacts-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #254100;
            color: #fff;
            padding: .2rem .8rem;
        }

        #contacts-bar ul {
            margin: 0;
            padding: .8rem;
            list-style-type: none;
        }

        #contacts-bar li {
            display: inline-block;
        }

        #contacts-bar #contacts li {
            padding: 0 .5rem;
        }

        #contacts-bar li a {
            color: #fff;
            text-decoration: none;
        }

        #social-links li a {
            display: inline-block;
            background-color: rgb(190, 184, 0);
            border-radius: 50px;
            width: var(--social-link-size);
            height: var(--social-link-size);
            text-align: center;
            line-height: var(--social-link-size);
        }

        #logo img {
            float: left;
            height: 50px;
            margin: .2rem .5rem .2rem 2rem;
        }

        #top-bar h1 {
            float: left;
            font-size: 1.7rem;
        }

        #top-bar::after {
            content: '';
            display: table;
            clear: both;
        }

        nav {
            float: right;
            padding: .2rem 1.3rem;
        }

        nav ul {
            margin: 1.3rem 0;
        }

        nav li {
            display: inline-block;
        }

        nav li a {
            text-transform: uppercase;
            text-decoration: none;
            padding: 0 .5rem;
            color: rgb(76, 76, 76);
        }

        .active a {
            color: rgb(163, 133, 0);
        }

        #hero {
            background: url('assets/img/bg.jpg') center/cover no-repeat;
            height: 700px;
            color: white;
            padding: 4rem;
        }

        hgroup {
            display: inline-block;
            margin-top: 15rem;
            padding: 1rem;
            backdrop-filter: blur(30px);
            border-radius: 10px;
            border: 0px solid white;
            clear: both;
        }

        #hero h2 {
            width: 920px;
            float: left;
            margin: 1rem 0 1rem;
            font-size: 4.5rem;
            text-shadow: 0px 0px 60px #000000;
            clear: both;
        }

        #hero h3 {
            width: 920px;
            float: left;
            font-size: 1.5rem;
            text-shadow: 0px 0px 60px #000000;
            clear: both;
        }
    </style>
</head>

<body>
    <header>
        <section id="contacts-bar">
            <ul id="contacts">
                <li><a href="tel:+1234567890"><i class="fa-solid fa-phone-flip"></i> +012 345 6789</a></li>
                <li><a href="mailto:info@paintpro.com"><i class="fa-solid fa-envelope-open"></i> info@paintpro.com</a>
                </li>
            </ul>
            <ul id="social-links">
                <li><a href="#!"><i class="fa-brands fa-facebook-f"></i></a></li>
                <li><a href="#!"><i class="fa-brands fa-x-twitter"></i></a></li>
                <li><a href="#!"><i class="fa-brands fa-instagram"></i></a></li>
                <li><a href="#!"><i class="fa-brands fa-linkedin-in"></i></a></li>
            </ul>
        </section>
        <section id="top-bar">
            <picture id="logo">
                <source srcset="assets/img/painpro-logo.webp" type="image/webp">
                <img src="assets/img/painpro-logo.png" alt="PaintPro">
            </picture>
            <h1>PaintPro</h1>
            <nav>
                <ul>
                    <li class="active"><a href="#!">Home</a></li>
                    <li><a href="#!">About</a></li>
                    <li><a href="#!">Service</a></li>
                    <li><a href="#!">Project</a></li>
                    <li><a href="#!">Pages</a></li>
                    <li><a href="#!">Contact</a></li>
                </ul>
            </nav>
        </section>
    </header>
    <main>
        <section id="hero">
            <hgroup>
                <h2>Bring Life to Your Walls with Colors!</h2>
                <h3>Revitalize your walls with our professional painting services. We're here to breathe new life into
                    your
                    home or
                    workplace.</h3>
            </hgroup>


        </section>
    </main>

</body>

</html>
